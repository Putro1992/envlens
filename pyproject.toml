[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envlens"
version = "0.1.0"
description = "A zero-dependency lens for .env files: verify, diff and audit configuration without leaking secrets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhani Putro Nugroho" }]
keywords = ["dotenv", "env", "cli", "configuration", "devops", "security", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
envlens = "envlens.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/envlens"
Repository = "https://github.com/YOUR_USERNAME/envlens"
Issues = "https://github.com/YOUR_USERNAME/envlens/issues"
Changelog = "https://github.com/YOUR_USERNAME/envlens/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envlens = ["py.typed"]
